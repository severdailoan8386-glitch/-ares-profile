

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>ARESS | LEGENDARY GUILD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 20%,
      rgba(180,0,0,.2), transparent 55%);
    z-index: -1;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 45px 22px 30px;
}

.avatar {
    width: 155px;
    height: 155px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #a80000;
    box-shadow: 0 0 30px #b00000;
    margin-bottom: 30px;
}

h1 {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 20px;
    text-shadow: 0 0 15px red;
}

.description {
    color: #aaa;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 35px;
}

.social {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 40px;
}

.social a {
    color: #ddd;
    text-decoration: none;
    font-weight: bold;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.link {
    display: block;
    padding: 23px 12px;
    border-radius: 16px;
    background: linear-gradient(135deg,#bd0000,#450000);
    border: 1px solid #ff3333;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 0 15px rgba(255,0,0,.2);
    transition: .25s;
}

.link:active {
    transform: scale(.96);
}

.music {
    margin-top: 40px;
    padding: 25px 15px;
    border: 1px solid #6e1717;
    border-radius: 18px;
    background: #151010;
}

.music h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.music p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 18px;
}

#play {
    border: none;
    border-radius: 30px;
    padding: 15px 35px;
    background: #bd0000;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#status {
    margin-top: 15px;
    color: #ff5555;
    font-size: 13px;
}

footer {
    color: #777;
    margin-top: 55px;
    font-size: 13px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <!-- ẢNH ĐẠI DIỆN -->
    <img class="avatar"
         src="avatar.jpg.PNG"
         alt="ARESS">

    <h1>Thanh Vinh Nguyen (Aress)</h1>

    <div class="description">
        Thành viên quân đoàn yêu cầu vào cả 2 box
        <br>
        <strong>LEGENDARY GUILD</strong>
    </div>

    <!-- MẠNG XÃ HỘI -->
    <div class="social">
        <a href="#" target="_blank">Facebook</a>
        <a href="#" target="_blank">TikTok</a>
        <a href="https://zalo.me/0966405875"
           target="_blank">Zalo</a>
    </div>

    <!-- CÁC LIÊN KẾT -->
    <div class="links">

        <a class="link"
           href="https://m.me/j/3Qoz2Y_MHdQsmqc8/?send_source=gc:copy_invite_link_c"
           target="_blank">
           BOX CHAT QUÂN ĐOÀN
        </a>

        <a class="link"
           href="https://m.me/ch/zkOPdfCBqdKQz0bN/?send_source=cm:copy_invite_link"
           target="_blank">
           BOX THÔNG BÁO QUÂN ĐOÀN
        </a>

        <a class="link"
           href="https://zalo.me/0966405875"
           target="_blank">
           NHẬN NẠP KIM CƯƠNG INDO
        </a>

    </div>

    <!-- NHẠC NỀN -->
    <div class="music">

        <h2>♫ ARESS MUSIC</h2>

        <p>LEGENDARY GUILD</p>

        <audio id="song" loop preload="auto">
            <source src="music.mp3" type="audio/mpeg">
        </audio>

        <button id="play" onclick="toggleMusic()">
            ▶ PHÁT NHẠC
        </button>

        <div id="status">
            Chạm để bật nhạc
        </div>

        <p style="margin-top:18px">
            <a href="https://vt.tiktok.com/ZSpTAbf7p/"
               target="_blank"
               style="color:#ff5555;text-decoration:none">
               Mở bài nhạc TikTok
            </a>
        </p>

    </div>

    <footer>
        ARESS © LEGENDARY GUILD
    </footer>

</div>

<script>
const song = document.getElementById("song");
const play = document.getElementById("play");
const status = document.getElementById("status");

function toggleMusic() {
    if (song.paused) {
        song.play().then(() => {
            play.innerText = "Ⅱ TẠM DỪNG";
            status.innerText = "♫ Đang phát nhạc";
        }).catch(() => {
            status.innerText = "Không thể phát nhạc";
        });
    } else {
        song.pause();
        play.innerText = "▶ PHÁT NHẠC";
        status.innerText = "♫ Đã tạm dừng";
    }
}

// Thử tự động phát khi mở website
window.addEventListener("load", () => {
    song.play().then(() => {
        play.innerText = "Ⅱ TẠM DỪNG";
        status.innerText = "♫ Đang phát nhạc";
    }).catch(() => {
        status.innerText = "Chạm PHÁT NHẠC để bật tiếng";
    });
});
</script>

</body>
</html>
