
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARESS | LEGENDARY GUILD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111214;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
  padding: 65px 22px 35px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.avatar {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #444;
  margin-bottom: 25px;
  background: #242424;
}

h1 {
  font-size: 29px;
  margin: 12px 0;
}

.description {
  color: #aaa;
  font-size: 16px;
  margin: 20px 0 35px;
  line-height: 1.6;
}

.social {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 25px 0 55px;
}

.social a {
  color: #aaa;
  text-decoration: none;
  font-weight: bold;
}

.link {
  display: block;
  background: #f5f5f7;
  color: #171717;
  text-decoration: none;
  padding: 25px 12px;
  border-radius: 60px;
  font-size: 19px;
  font-weight: bold;
  margin: 20px 0;
  transition: .2s;
}

.link:active {
  transform: scale(.96);
}

.music {
  margin: 45px 0 30px;
  padding: 25px 15px;
  border: 1px solid #393939;
  border-radius: 20px;
}

.music button {
  background: white;
  color: black;
  border: none;
  padding: 14px 30px;
  border-radius: 35px;
  font-weight: bold;
  font-size: 16px;
}

.music p {
  color: #ccc;
}

footer {
  color: #888;
  margin-top: 75px;
  font-weight: bold;
  letter-spacing: 1px;
}
</style>
</head>

<body>
<div class="container">

<img class="avatar" src="avatar.jpg" alt="ARESS">

<h1>Thanh Vinh Nguyen (Aress)</h1>

<div class="description">
Thành viên quân đoàn yêu cầu vào cả 2 box
<br>
LEGENDARY GUILD
</div>

<div class="social">
<a href="#" target="_blank">Facebook</a>
<a href="#" target="_blank">TikTok</a>
<a href="#" target="_blank">Zalo</a>
</div>

<a class="link" href="https://m.me/">
Box Chat Quân Đoàn
</a>

<a class="link" href="https://zalo.me/">
Box Thông Báo Quân Đoàn
</a>

<a class="link" href="#">
Nạp Hộ Kim Cương Indo
</a>

<div class="music">
<p>♫ MUSIC PLAYER</p>
<p id="status">♪ Nhạc nền ARESS</p>

<audio id="song" src="music.mp3" loop></audio>

<button onclick="toggleMusic()" id="play">
▶ PHÁT NHẠC
</button>
</div>

<footer>
ARESS © LEGENDARY GUILD
</footer>

</div>

<script>
const song = document.getElementById("song");
const play = document.getElementById("play");
const status = document.getElementById("status");

function toggleMusic() {
  if (song.paused) {
    song.play().then(() => {
      play.innerText = "❚❚ TẠM DỪNG";
      status.innerText = "♫ Đang phát nhạc";
    }).catch(() => {
      status.innerText = "Không thể phát nhạc";
    });
  } else {
    song.pause();
    play.innerText = "▶ PHÁT NHẠC";
    status.innerText = "♪ Đã tạm dừng";
  }
}
</script>

</body>
</html>
